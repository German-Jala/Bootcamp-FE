<div class="flex flex-col gap-8 w-full animate-fade-in">
  
  <!-- Collection Header Area -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-white/5 pb-6 gap-4">
    <div>
      <h2 class="text-3xl font-extrabold text-white tracking-tight m-0">
        Colección de <span class="text-yellow-400 font-black">{{ profileService.duelistAlias() }}</span>
      </h2>
      <p class="text-xs text-white/50 m-0 mt-1.5">
        Tus cartas guardadas y barajas de referencia.
      </p>
    </div>
    
    <!-- Stats Badge -->
    <div class="bg-slate-900/50 border border-white/10 rounded-xl px-5 py-3 flex gap-4 items-center">
      <span class="text-2xl">🃏</span>
      <div class="flex flex-col">
        <span class="text-[10px] text-white/40 uppercase tracking-widest font-semibold">Total Cartas</span>
        <span class="text-lg font-black text-white leading-tight">
          {{ profileService.collection().length }}
        </span>
      </div>
    </div>
  </div>

  <!-- Cards Grid or Empty State -->
  @if (profileService.collection().length === 0) {
    <app-empty-results-view
      title="Tu colección está vacía"
      description="Explora el catálogo general de cartas y haz clic en 'Añadir a mi colección' en los detalles de cualquier carta para verla aquí."
    />
  } @else {
    <div class="grid grid-cols-[repeat(auto-fill,minmax(200px,1fr))] gap-8 py-4">
      @for (card of profileService.collection(); track card.id) {
        <app-card-preview [card]="card" />
      }
    </div>
  }
</div>
