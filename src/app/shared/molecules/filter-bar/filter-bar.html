<!-- Step 4: New Component -->

<div class="flex flex-col gap-3 p-4 bg-slate-900/40 border border-white/5 rounded-2xl backdrop-blur-md">
  <div class="flex flex-wrap items-center gap-3">
    <!-- Type Filter -->
    <div class="flex flex-col gap-1 min-w-[160px] flex-1">
      <label class="text-xs text-white/50 font-medium pl-1">Tipo de Carta</label>
      <select [value]="cardService.selectedType()" (change)="onTypeChange($event)"
        class="bg-slate-800/80 border border-white/10 text-white text-xs rounded-xl p-2.5 outline-none focus:border-yellow-500/50 focus:ring-1 focus:ring-yellow-500/50 transition-all cursor-pointer">
        @for (item of cardTypes; track item.value) {
        <option [value]="item.value" class="bg-slate-900 text-white">{{ item.label }}</option>
        }
      </select>
    </div>

    <!-- Attribute Filter -->
    <div class="flex flex-col gap-1 min-w-[160px] flex-1">
      <label class="text-xs text-white/50 font-medium pl-1 flex justify-between">
        <span>Atributo</span>
        @if (cardService.selectedType().includes('Spell') || cardService.selectedType().includes('Trap')) {
        <span class="text-[10px] text-yellow-400/70">(N/A)</span>
        }
      </label>
      <select [value]="cardService.selectedAttribute()" (change)="onAttributeChange($event)"
        [disabled]="cardService.selectedType().includes('Spell') || cardService.selectedType().includes('Trap')"
        class="bg-slate-800/80 border border-white/10 text-white text-xs rounded-xl p-2.5 outline-none focus:border-yellow-500/50 focus:ring-1 focus:ring-yellow-500/50 disabled:opacity-40 disabled:cursor-not-allowed transition-all cursor-pointer">
        @for (item of attributes; track item.value) {
        <option [value]="item.value" class="bg-slate-900 text-white">{{ item.label }}</option>
        }
      </select>
    </div>

    <!-- Race Filter -->
    <div class="flex flex-col gap-1 min-w-[160px] flex-1">
      <label class="text-xs text-white/50 font-medium pl-1">Clasificación</label>
      <select [value]="cardService.selectedRace()" (change)="onRaceChange($event)"
        class="bg-slate-800/80 border border-white/10 text-white text-xs rounded-xl p-2.5 outline-none focus:border-yellow-500/50 focus:ring-1 focus:ring-yellow-500/50 transition-all cursor-pointer">
        @for (item of races; track item.value) {
        <option [value]="item.value" class="bg-slate-900 text-white">{{ item.label }}</option>
        }
      </select>
    </div>

    <!-- Clear Filters Button -->
    @if (cardService.hasActiveFilters()) {
    <div class="flex flex-col justify-end pt-5">
      <button (click)="clearFilters()"
        class="text-xs text-yellow-400/90 hover:text-yellow-300 bg-yellow-500/10 hover:bg-yellow-500/20 border border-yellow-500/20 rounded-xl px-4 py-2.5 transition-all flex items-center gap-1.5 cursor-pointer">
        ✕ Limpiar filtros
      </button>
    </div>
    }
  </div>

  <!-- Active filters summary badge line -->
  @if (cardService.hasActiveFilters()) {
  <div class="flex items-center gap-2 pt-1 text-xs text-white/60 border-t border-white/5 mt-1">
    <span class="text-yellow-400 font-semibold">Filtros activos:</span>
    <span class="truncate">{{ cardService.activeFiltersSummary() }}</span>
  </div>
  }
</div>
