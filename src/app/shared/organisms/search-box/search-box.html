<div class="flex flex-col gap-3 w-full">
  <div
    class="relative flex items-center w-full bg-slate-800/40 border border-white/10 rounded-xl transition-all duration-300 focus-within:border-yellow-500/50 focus-within:bg-slate-800/60 focus-within:shadow-[0_0_0_4px_rgba(255,215,0,0.08)]">
    <span class="absolute left-4 text-white/40 pointer-events-none">🔍</span>
    <input #searchInput type="text" [placeholder]="placeholder()"
      class="w-full py-4 pl-12 pr-12 bg-transparent border-none text-white text-base outline-none placeholder-white/35 font-sans"
      [value]="value()" (input)="onInput($event)" aria-label="Buscar" />
    @if (value()) {
    <button
      class="absolute right-4 bg-transparent border-none text-white/40 cursor-pointer text-sm p-1 rounded-full flex items-center justify-center transition-all hover:text-white hover:bg-white/10"
      (click)="clear()" aria-label="Limpiar">
      ✕
    </button>
    }
  </div>

  @if (loading()) {
  <div class="pl-2 mt-1 flex justify-left items-center">
    <app-spinner label="Buscando en la base de datos..."></app-spinner>
  </div>
  } @else if (value() && showResultsInfo()) {
  <div class="pl-2 text-xs text-white/50">
    Resultados para "<span class="text-yellow-400 font-semibold">{{ value() }}</span>"
  </div>
  }
</div>
